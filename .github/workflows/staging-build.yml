name: Staging build

# Manual only — Windows builds are expensive; never run on push.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: staging
        type: string
      artifact_label:
        description: Optional label suffix for the downloaded artifact
        required: false
        default: ""
        type: string

concurrency:
  group: staging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows portable bundle
    runs-on: windows-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows app bundle (no installer)
        run: npm run tauri build -- --bundles app
        env:
          CI: true

      - name: Package portable zip
        shell: pwsh
        run: |
          $appBundleRoot = "src-tauri/target/release/bundle/app"
          if (-not (Test-Path $appBundleRoot)) {
            throw "App bundle not found at $appBundleRoot"
          }
          $appDir = Get-ChildItem -Path $appBundleRoot -Directory |
            Select-Object -First 1
          if (-not $appDir) {
            throw "No app directory found under $appBundleRoot"
          }
          $archiveName = "agentic-afker-windows-portable"
          if ("${{ inputs.artifact_label }}" -ne "") {
            $archiveName += "-${{ inputs.artifact_label }}"
          }
          $archiveName += "-${{ github.sha }}"
          Compress-Archive -Path "$($appDir.FullName)/*" -DestinationPath "$archiveName.zip"
          "ARCHIVE_NAME=$archiveName.zip" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30
