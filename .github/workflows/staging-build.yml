name: Staging build

# Manual only — Windows builds are expensive; never run on push.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: staging
        type: string
      artifact_label:
        description: Optional label suffix for the downloaded artifact
        required: false
        default: ""
        type: string

concurrency:
  group: staging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows portable bundle
    runs-on: windows-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows release binary (no installer)
        run: npm run tauri build -- --no-bundle
        env:
          CI: true

      - name: Stage portable bundle
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $exe = Join-Path $releaseDir "agentic-afker.exe"
          if (-not (Test-Path $exe)) {
            throw "Release binary not found at $exe"
          }

          $stageDir = "agentic-afker-portable"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $exe $stageDir

          # WebView2 loader and any sidecar DLLs Tauri places beside the exe
          Get-ChildItem -Path $releaseDir -Filter "*.dll" | Copy-Item -Destination $stageDir

          if (Test-Path "$releaseDir/resources") {
            Copy-Item "$releaseDir/resources" $stageDir -Recurse
          }

          Copy-Item "scripts/run-dev.bat" $stageDir

          if (Get-ChildItem -Path $stageDir -Filter "*.zip" -Recurse) {
            throw "Refusing to upload nested zip inside staged portable bundle"
          }

          $artifactName = "agentic-afker-windows-portable"
          if ("${{ inputs.artifact_label }}" -ne "") {
            $artifactName += "-${{ inputs.artifact_label }}"
          }
          $artifactName += "-${{ github.sha }}"
          "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV
          "STAGE_DIR=$stageDir" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          # Name must not end in .zip — GitHub wraps the download in a zip already.
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.STAGE_DIR }}
          retention-days: 30
